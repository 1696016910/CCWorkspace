name: release-node

# 只构建 Node 版。Go / Rust 各有独立的 workflow，
# 三者互不阻塞：某个实现构建失败不会拦下另外两个。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-node-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: node

jobs:
  # 先建好 Release。三个 workflow 都会调这个 job，
  # 谁先跑谁创建，其余走"已存在"分支。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        working-directory: .
        run: echo "tag=v$(node -p "require('./node/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          echo "目标 tag: $tag"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" != "$tag" ]]; then
            echo "::error::当前触发的是 tag ${GITHUB_REF_NAME}，与版本 $tag 不一致"
            exit 1
          fi

          remote_sha=$(git ls-remote --tags origin "refs/tags/$tag^{}" | cut -f1)
          [ -z "$remote_sha" ] && remote_sha=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [ -z "$remote_sha" ]; then
            echo "::error::远端不存在 tag $tag"
            exit 1
          fi

          head_sha=$(git rev-parse HEAD)
          if [ "$remote_sha" != "$head_sha" ]; then
            echo "::error::tag $tag 指向 $remote_sha，当前构建 $head_sha"
            exit 1
          fi
          echo "tag 与提交一致：$head_sha"

          check_release() { gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" >/dev/null 2>&1; }

          if check_release; then
            is_draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" --jq '.draft')
            if [ "$is_draft" = "true" ]; then
              gh release delete "$tag" --yes --cleanup-tag=false || true
              gh release create "$tag" --draft=false --title "$tag" --notes "自动化构建产物"
            fi
          else
            gh release create "$tag" --draft=false --title "$tag" --notes "自动化构建产物"
          fi

          for i in 1 2 3 4 5; do
            if check_release; then echo "Release 就绪"; exit 0; fi
            sleep 2
          done
          echo "::error::Release $tag 创建后仍查不到"
          exit 1

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/package-lock.json

      # lockfile 里的 resolved 指向国内镜像，GitHub runner 跨境访问会抖
      - run: npm config set registry https://registry.npmjs.org

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Package and publish
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Release 超过 2 小时后 electron-builder 会静默跳过上传，这个开关让它照常覆盖
          EP_GH_IGNORE_TIME: 'true'

      # 唯一防线：确认产物真的传上去了，否则"CI 绿了但收不到更新"没人发现
      - name: Assert assets uploaded
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./node/package.json').version")"
          names=$(gh release view "$tag" --json assets -q '.assets[].name' || true)
          echo "ASSET_NAMES=[$names]"
          if [[ "${{ matrix.args }}" == "--win" ]]; then
            echo "$names" | grep -q -- "ClaudeWorkbench-Node-.*-x64.exe" || { echo "缺少 Node 版 Windows 安装包"; exit 1; }
            echo "$names" | grep -q -- "ClaudeWorkbench-Node-.*-portable.exe" || { echo "缺少 Node 版 Windows 免安装包"; exit 1; }
          elif [[ "${{ matrix.args }}" == "--linux" ]]; then
            echo "$names" | grep -q -- "ClaudeWorkbench-Node-.*\.AppImage" || { echo "缺少 Node 版 AppImage"; exit 1; }
          else
            echo "$names" | grep -q -- "ClaudeWorkbench-Node-.*\.zip" || { echo "缺少 Node 版 macOS zip"; exit 1; }
          fi
