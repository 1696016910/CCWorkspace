name: release

# 推 tag 触发：npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先建好 Release 再构建。
  # electron-builder 的 createRelease() 遇到并发创建会收到 422 且不重试，
  # 三个平台并行时第二个 job 必然失败。这里提前建好，后续都走"已存在"分支。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "$tag" --notes "自动化构建产物"

  build:
    needs: prepare
    strategy:
      # 一个平台失败不影响其他平台继续产出
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # node:sqlite 需要 Node 22+，Electron 45 内置版本已满足
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # --publish always 上传产物与 latest*.yml 到 prepare 阶段建好的 Release
      - name: Package and publish
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 未签名时禁止 electron-builder 尝试寻找证书而中断
          CSC_IDENTITY_AUTO_DISCOVERY: false
