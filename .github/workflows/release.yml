name: release

# 推 tag 触发：npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 同一个 tag 只允许一条流水线在跑：并发触发会抢同一个 Release，
# 同名产物走"删了再传"，latest*.yml 可能来自不同一次运行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先建好 Release 再构建。
  # electron-builder 的 createRelease() 遇到并发创建会收到 422 且不重试，
  # 三个平台并行时第二个 job 必然失败。这里提前建好，后续都走"已存在"分支。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          echo "目标 tag: $tag"

          # 绑定构建与 tag：确认这次构建确实是为这个 tag 跑的，
          # 且 tag 指向的提交就是当前检出的提交。
          # 否则产物可能与 tag 上的源码对不上（供应链风险）。
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" != "$tag" ]]; then
            echo "::error::当前触发的是 tag ${GITHUB_REF_NAME}，与 package.json 版本 $tag 不一致"
            exit 1
          fi

          remote_sha=$(git ls-remote --tags origin "refs/tags/$tag^{}" | cut -f1)
          if [ -z "$remote_sha" ]; then
            remote_sha=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          fi
          if [ -z "$remote_sha" ]; then
            echo "::error::远端不存在 tag $tag，请先推送 tag 再触发发布"
            exit 1
          fi

          head_sha=$(git rev-parse HEAD)
          if [ "$remote_sha" != "$head_sha" ]; then
            echo "::error::tag $tag 指向 $remote_sha，但当前构建的是 $head_sha"
            exit 1
          fi
          echo "tag $tag 与检出提交一致：$head_sha"

          # 预建 Release，避免三个平台并发创建时 electron-builder 收到 422。
          # 必须用 --draft=false 建正式版：gh 默认创建的是 draft，
          # 而 electron-builder 遇到 draft Release 会走另一条分支，
          # 导致 --publish always 静默不上传（产物为空）。
          check_release() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" >/dev/null 2>&1
          }

          if check_release; then
            is_draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" --jq '.draft')
            if [ "$is_draft" = "true" ]; then
              echo "已有的 Release 是 draft，删除后重建为正式版"
              gh release delete "$tag" --yes --cleanup-tag=false || true
              gh release create "$tag" --draft=false --title "$tag" --notes "自动化构建产物"
            else
              echo "Release 已存在且为正式版，继续"
            fi
          else
            echo "创建正式版 Release"
            gh release create "$tag" --draft=false --title "$tag" --notes "自动化构建产物"
          fi

          # 创建后确认
          for i in 1 2 3 4 5; do
            if check_release; then
              echo "Release 就绪: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Release $tag 创建后仍查不到"
          exit 1

  build:
    needs: prepare
    strategy:
      # 一个平台失败不影响其他平台继续产出
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # node:sqlite 需要 Node 22+，Electron 45 内置版本已满足
      #
      # lockfile 里的 resolved 指向国内镜像，GitHub runner 跨境访问它
      # 一旦限流/抖动就是三平台同时失败。这里让 npm 用官方源重解析。
      - run: npm config set registry https://registry.npmjs.org

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # --publish always 上传产物与 latest*.yml 到 prepare 阶段建好的 Release
      - name: Package and publish
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Release 创建超过 2 小时后 electron-builder 会静默跳过上传且不报错，
          # 三平台全绿但产物没上传。这个开关让它照常覆盖。
          EP_GH_IGNORE_TIME: 'true'

      # 唯一的自动防线：确认产物真的传上去了。
      # 否则"CI 绿了但客户端收不到更新"这种静默失败没人发现。
      - name: Assert assets uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "::group::release info"
          gh release view "$tag" --json tagName,isDraft,assets | head -50 || echo "GH_VIEW_FAILED:$?"
          echo "::endgroup::"
          names=$(gh release view "$tag" --json assets -q '.assets[].name' || true)
          echo "ASSET_NAMES=[$names]" 
          if [[ "${{ matrix.args }}" == "--win" ]]; then
            echo "$names" | grep -q "latest.yml" || { echo "缺少 latest.yml"; exit 1; }
            echo "$names" | grep -q -- "-x64.exe" || { echo "缺少 Windows 安装包"; exit 1; }
          elif [[ "${{ matrix.args }}" == "--linux" ]]; then
            echo "$names" | grep -q "latest-linux.yml" || { echo "缺少 latest-linux.yml"; exit 1; }
            echo "$names" | grep -q -- ".AppImage" || { echo "缺少 AppImage"; exit 1; }
          else
            echo "$names" | grep -q "latest-mac.yml" || { echo "缺少 latest-mac.yml"; exit 1; }
            echo "$names" | grep -q -- ".zip" || { echo "缺少 macOS zip"; exit 1; }
          fi
